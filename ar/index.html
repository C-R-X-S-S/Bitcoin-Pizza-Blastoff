<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1610">
    <title>Bitcoin Pizza Blastoff AR</title>
    <link rel="stylesheet" href="./styles.css?v=20260518-7">
  </head>
  <body>
    <canvas id="camerafeed" aria-label="AR camera view"></canvas>

    <main id="launch" class="panel">
      <img class="splash-art" src="./assets/ar-landing-page-image.png" alt="Bitcoin Pizza Blastoff hot air food truck artwork">
      <h1 class="brand-heading">Bitcoin Pizza Blastoff</h1>
      <div class="experience-heading">AR Experience</div>
      <p>Open the camera, point your phone at the sky, and look for the floating pizza truck.</p>
      <button id="startButton" type="button">Start AR</button>
      <div id="status">Loading AR engine...</div>
    </main>

    <div id="hud" hidden>
      <span id="hudText">Point your phone at the sky</span>
      <button id="recenterButton" type="button">Recenter</button>
    </div>

    <div id="unsupported" class="panel" hidden>
      <h1>Open on a phone</h1>
      <p>This AR view needs a mobile browser with camera access over HTTPS.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
      async
      crossorigin="anonymous"
      data-preload-chunks="slam">
    </script>
    <script src="./app.js?v=20260518-5" defer></script>
  </body>
</html>
